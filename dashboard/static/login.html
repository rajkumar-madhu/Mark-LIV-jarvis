<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Mark LIV Remote</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #f4f6f8;
      --card:   #ffffff;
      --border: #e2e6eb;
      --accent: #1d4ed8;
      --adim:   #eff4ff;
      --text:   #111827;
      --muted:  #5b6573;
      --danger: #b42318;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap {
      width: 100%;
      max-width: 400px;
    }
    .brand {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .sub {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px 24px;
    }
    .hint {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .hint strong { color: var(--text); font-weight: 600; }
    .label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .key-input {
      width: 100%;
      padding: 14px 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 22px;
      font-weight: 650;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      text-align: center;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      outline: none;
      caret-color: var(--accent);
    }
    .key-input::placeholder {
      color: #c5cbd3;
      letter-spacing: 0.28em;
      font-weight: 500;
    }
    .key-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
    }
    .err {
      font-size: 13px;
      color: var(--danger);
      min-height: 18px;
      margin: 10px 0 12px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover  { background: #1a44bd; }
    .btn:active { background: #163a9e; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-6px); }
      40%,80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.35s ease; }
    .note {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    #reconnecting {
      display: none;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">Mark LIV</div>
      <div class="sub">Remote dashboard</div>
    </div>
    <div class="card" id="card">
      <p id="reconnecting">Reconnecting to this computer…</p>
      <p class="hint">On the computer, open <strong>Remote Control</strong>, then enter the 6-character key. Keys expire after 10 minutes.</p>
      <label class="label" for="key">Session key</label>
      <input class="key-input" id="key" type="text" maxlength="6"
             autocomplete="off" autocorrect="off" spellcheck="false"
             inputmode="text" aria-label="Session key"
             placeholder="------">
      <div class="err" id="err"></div>
      <button class="btn" onclick="doLogin()">Connect</button>
      <p class="note">Microphone access on HTTP may require a one-time browser setting after you connect.</p>
    </div>
  </div>

  <script>
    (async function() {
      const devTok = localStorage.getItem('jarvis_device_token');
      if (!devTok) return;
      document.getElementById('reconnecting').style.display = 'block';
      try {
        const r = await fetch('/api/device-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_token: devTok }),
        });
        const d = await r.json();
        if (d.ok && d.token) {
          sessionStorage.setItem('jarvis_key', d.key);
          sessionStorage.setItem('jarvis_token', d.token);
          location.replace('/');
          return;
        }
      } catch (_) {}
      localStorage.removeItem('jarvis_device_token');
      document.getElementById('reconnecting').style.display = 'none';
    })();

    const inp = document.getElementById('key');
    inp.focus();

    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
      if (inp.value.length === 6) doLogin();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const key = inp.value.trim();
      if (key.length < 6) { shake(); return; }
      let data;
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: key })
        });
        data = await r.json();
      } catch (e) {
        document.getElementById('err').textContent = 'Could not reach the computer.';
        shake(); return;
      }
      if (data.ok && data.token) {
        sessionStorage.setItem('jarvis_key', key);
        sessionStorage.setItem('jarvis_token', data.token);
        location.href = '/';
      } else {
        inp.value = '';
        inp.focus();
        document.getElementById('err').textContent = 'That key is wrong or expired. Generate a new one on the computer.';
        shake();
      }
    }

    function shake() {
      const c = document.getElementById('card');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }
  </script>
</body>
</html>
