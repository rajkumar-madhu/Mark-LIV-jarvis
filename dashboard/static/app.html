<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Mark LIV Remote</title>
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #f4f6f8;
      --surface: #ffffff;
      --border:  #e2e6eb;
      --accent:  #1d4ed8;
      --adim:    #eef3ff;
      --text:    #111827;
      --muted:   #5b6573;
      --green:   #067647;
      --gdim:    #ecfdf3;
      --danger:  #b42318;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      flex-shrink: 0;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .logo {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .logo span { color: var(--muted); font-weight: 500; margin-left: 8px; font-size: 12px; }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 999px; background: #f3f4f6; border: 1px solid var(--border);
      font-size: 11px; font-weight: 600; color: var(--muted);
    }
    .pill.on { background: var(--gdim); border-color: #abefc6; color: var(--green); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #98a2b3; }
    .pill.on .dot { background: var(--green); }
    .spacer { flex: 1; }
    .enc-badge {
      font-size: 11px; font-weight: 600; padding: 3px 8px;
      border-radius: 6px; display: none; border: 1px solid var(--border);
    }
    .enc-badge.on  { display: inline-block; background: var(--gdim); border-color: #abefc6; color: var(--green); }
    .enc-badge.off { display: inline-block; background: #fef3f2; border-color: #fecdca; color: var(--danger); }
    .url {
      font-size: 11px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: var(--muted); padding: 4px 8px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px;
    }

    main {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    main::-webkit-scrollbar { width: 8px; }
    main::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 8px; }
    .empty {
      margin: auto 0;
      width: 100%;
      padding: 0 24px;
      text-align: center;
      color: var(--muted);
    }
    .empty h2 { font-size: 16px; font-weight: 650; color: var(--text); margin-bottom: 8px; }
    .empty p { font-size: 14px; line-height: 1.55; max-width: 400px; margin: 0 auto; }
    .msg {
      max-width: 82%; padding: 10px 14px; border-radius: 10px;
      font-size: 14px; line-height: 1.55; background: var(--surface);
      border: 1px solid var(--border);
    }
    .msg-j { align-self: flex-start; background: var(--adim); border-color: #d6e2ff; }
    .msg-u { align-self: flex-end; }
    .msg-sys {
      align-self: center; font-size: 12px; color: var(--muted);
      padding: 4px 0; background: transparent; border: none;
    }
    .lbl {
      font-size: 11px; font-weight: 600; color: var(--muted);
      margin-bottom: 4px;
    }
    .msg-j .lbl { color: var(--accent); }
    .msg-u .lbl { text-align: right; }

    .msg-file {
      align-self: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; display: flex;
      align-items: center; gap: 12px; max-width: 82%;
    }
    .fc-badge {
      flex-shrink: 0; min-width: 40px; text-align: center;
      font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
      padding: 8px 6px; border-radius: 6px; background: #f2f4f7; color: #344054;
    }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 4px; background: #eaecf0; border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 11px; font-weight: 600; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: var(--danger); }
    .fc-dl { display: block; margin-top: 6px; font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 600; }
    .fc-dl:hover { text-decoration: underline; }

    .help-card {
      align-self: stretch;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      font-size: 13px;
      line-height: 1.7;
    }
    .help-card h3 { font-size: 13px; font-weight: 650; margin-bottom: 8px; }
    .help-card ol { padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
    .help-card code, .flags-url {
      background: var(--bg); padding: 1px 6px; border-radius: 4px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px;
    }
    .flags-url { display: inline-block; margin-top: 4px; cursor: pointer; user-select: all; }

    footer {
      flex-shrink: 0; width: 100%; padding: 10px 12px 14px;
      border-top: 1px solid var(--border); background: var(--surface);
      display: flex; gap: 8px; align-items: center;
    }
    #inp {
      flex: 1; padding: 11px 12px; background: #fff;
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 14px; outline: none;
    }
    #inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12); }
    #inp::placeholder { color: #98a2b3; }
    .btn {
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer; background: #fff; color: var(--text);
    }
    .btn:hover { background: var(--bg); }
    .btn-send { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-send:hover { background: #1a44bd; }
    .btn-wake { display: none; }
    .btn-wake.show { display: block; color: var(--green); border-color: #abefc6; background: var(--gdim); }
    .icon-btn {
      width: 42px; height: 42px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: #fff; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; cursor: pointer;
    }
    .icon-btn:hover { color: var(--accent); border-color: #b7c7f0; background: var(--adim); }
    .icon-btn svg { width: 18px; height: 18px; }
    #mic-btn.recording {
      background: #fef3f2; border-color: #fecdca; color: var(--danger);
    }
    #mic-btn.unsupported { opacity: 0.35; cursor: not-allowed; }

    #toast {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%) translateY(-8px);
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px;
      opacity: 0; transition: opacity 0.2s, transform 0.2s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
      .url { display: none; }
      header { gap: 8px; flex-wrap: wrap; }
      .logo span { display: none; }
      footer { padding-bottom: 18px; }
      #inp { min-width: 0; }
    }
  </style>
</head>
<body>
  <div id="toast"></div>
  <header>
    <div class="logo">Mark LIV<span>Remote</span></div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">Encrypted</div>
    <div class="spacer"></div>
    <div class="url">__IP__:__PORT__</div>
  </header>
  <main id="feed">
    <div class="empty" id="empty">
      <h2>Ready to send commands</h2>
      <p>Type a message, attach a file, or use the microphone. Activity from this computer appears here.</p>
    </div>
  </main>
  <footer>
    <input id="inp" placeholder="Message Mark LIV…" autocomplete="off">
    <label class="icon-btn" for="file-inp" title="Attach file" aria-label="Attach file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21.44 11.05l-8.49 8.49a6 6 0 01-8.49-8.49l8.49-8.49a4 4 0 015.66 5.66l-8.49 8.49a2 2 0 01-2.83-2.83l7.78-7.78"/>
      </svg>
    </label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="mic-btn" class="icon-btn" onclick="doMic()" title="Voice command" aria-label="Voice command">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="9" y="3" width="6" height="11" rx="3"/>
        <path d="M5 11a7 7 0 0014 0M12 18v3"/>
      </svg>
    </button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">Wake</button>
    <button class="btn btn-send" onclick="doSend()">Send</button>
  </footer>

  <script>
    const MIC_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>';
    const STOP_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>';

    const _authToken  = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    const _AES_SALT = 'JARVIS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; encBadge.textContent = 'Not encrypted'; }

    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { sys('Remote session active.'); toast('Connected'); };
    ws.onclose   = () => sys('Connection lost. Refresh this page to reconnect.');
    ws.onerror   = () => sys('Connection error.');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
    };

    function hideEmpty() {
      const e = document.getElementById('empty');
      if (!e) return;
      const hasConversation = feed.querySelector('.msg-j, .msg-u, .msg-file, .help-card');
      e.hidden = !!hasConversation;
    }

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Sleeping'; wake.classList.add('show');
      }
    }

    function append(speaker, text) {
      hideEmpty();
      const d = document.createElement('div');
      if (speaker === 'jarvis') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">Mark LIV</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">You</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return 'IMG';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return 'VID';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return 'AUD';
      if (['pdf'].includes(ext))                                                             return 'PDF';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return 'DOC';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return 'XLS';
      if (['ppt','pptx','odp'].includes(ext))                                               return 'PPT';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return 'ZIP';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return 'APP';
      return 'FILE';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    function _uploadFile(file) {
      hideEmpty();
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-badge">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = 'Done'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">Download copy</a>`);
          toast('File saved on the computer');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = 'var(--danger)';
          if (st)  { st.textContent = 'Error'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'Error'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    function _onFileReceived(m) {
      hideEmpty();
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-badge">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Received</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">Download</a>
        </div>
        <div class="fc-status done">Done</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('File received on the computer');
    }

    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = '';
    });

    function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      const enc  = _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('Waking the assistant…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    function _micIdle() {
      micBtn.innerHTML = MIC_ICON;
      micBtn.title     = 'Voice command';
      micBtn.setAttribute('aria-label', 'Voice command');
      micBtn.classList.remove('recording');
    }

    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return;
      hideEmpty();
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.className = 'help-card';
      card.innerHTML =
        '<h3>Microphone setup (one time)</h3>' +
        '<ol>' +
        '<li>Open a new tab and go to <code>chrome://flags</code></li>' +
        '<li>Search for <strong>Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span class="flags-url" id="flags-url">' + esc(origin) + '</span></li>' +
        '<li>Set it to <strong>Enabled</strong>, then tap <strong>Relaunch</strong></li>' +
        '<li>Return here and tap the microphone button</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL copied')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied. Allow it from the address-bar lock, then try again.'
          : 'Microphone error: ' + e.message);
        return;
      }

      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = STOP_ICON;
        micBtn.title     = 'Stop recording';
        micBtn.setAttribute('aria-label', 'Stop recording');
        micBtn.classList.add('recording');
        sys('Voice live — speak now');
        toast('Microphone live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
  </script>
</body>
</html>
